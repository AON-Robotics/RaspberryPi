<!doctype html>
<!--
  Emergency STOP page, served by the robot server at GET /stop.

  It calls the server's stop tool directly, so it works even when the laptop,
  Ollama, or the agent loop are down. Open it on a phone and keep it handy.

  The token is typed once and remembered by this browser (localStorage), so
  the page itself contains no secret. Use the STOP_TOKEN here if the server
  has one: it can only stop the robot, never drive it.

  Script and styles live in static/ because the server's Content-Security-
  Policy blocks inline code (see SECURITY_HEADERS in server.py).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot STOP</title>
<link rel="stylesheet" href="/static/stop.css">
</head>
<body>
  <button id="stop" type="button">STOP</button>
  <div id="status" aria-live="assertive"></div>
  <div class="hint">Space or Esc also sends STOP.</div>

  <form id="token-form">
    <input id="token" type="password" placeholder="Stop token (or server token)" autocomplete="off">
    <button type="submit">Save</button>
  </form>

<script src="/static/stop.js"></script>
</body>
</html>
