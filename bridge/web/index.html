<!doctype html>
<!--
  Robot chat page. Talks only to the web app (app.py) that served it:
    POST /api/chat   send a message, get the reply + the tools that ran
    POST /api/stop   STOP button, goes straight to the robot (no LLM)
    POST /api/reset  "New chat"
  Tool results are shown as raw JSON on purpose, so when the real robot
  tools return different fields, this page needs no changes.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Chat</title>
<style>
  :root {
    --bg: #f5f5f4; --panel: #ffffff; --fg: #1c1c1c; --muted: #6b6b6b; --border: #dcdcdc;
    --user: #1f5fbf; --user-fg: #ffffff; --tool: #f0f0ee; --err: #b00020;
    --stop: #d0021b; --stop-press: #8f0012;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141414; --panel: #1e1e1e; --fg: #ececec; --muted: #9a9a9a; --border: #333;
      --user: #3b7be0; --tool: #262626; --err: #ff6b7f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141414; --panel: #1e1e1e; --fg: #ececec; --muted: #9a9a9a; --border: #333;
    --user: #3b7be0; --tool: #262626; --err: #ff6b7f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }

  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
           border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 18px; margin: 0; }
  header .meta { color: var(--muted); font-size: 13px; flex: 1; min-width: 0;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header a, header button.link { color: var(--muted); font-size: 13px; background: none; border: none;
                                 cursor: pointer; padding: 0; text-decoration: underline; font-family: inherit; }

  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: min(720px, 90%); padding: 10px 14px; border-radius: 12px; white-space: pre-wrap;
         overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-fg); }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .err { align-self: center; color: var(--err); font-size: 14px; }
  .note { align-self: center; color: var(--muted); font-size: 14px; }
  .tools { align-self: flex-start; max-width: min(720px, 90%); display: flex; flex-direction: column; gap: 4px; }
  details { background: var(--tool); border-radius: 8px; padding: 6px 10px; font-size: 14px; }
  summary { cursor: pointer; font-family: ui-monospace, Menlo, Consolas, monospace; }
  summary .bad { color: var(--err); }
  pre { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
  .thinking { align-self: flex-start; color: var(--muted); font-style: italic; }

  footer { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border);
           background: var(--panel); align-items: stretch; }
  #input { flex: 1; min-width: 0; resize: none; padding: 10px 12px; font: inherit; color: var(--fg);
           background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
  #send { padding: 0 18px; font: inherit; border-radius: 10px; border: 1px solid var(--border);
          background: var(--bg); color: var(--fg); cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
  #stop { padding: 0 22px; border: none; border-radius: 10px; background: var(--stop); color: #fff;
          font-weight: 800; font-size: 18px; letter-spacing: 1px; cursor: pointer;
          box-shadow: 0 4px 0 var(--stop-press); }
  #stop:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--stop-press); }

  @media (max-width: 520px) {
    footer { flex-wrap: wrap; }
    #input { flex-basis: 100%; }
    #send, #stop { flex: 1; padding: 12px; }
  }
</style>
</head>
<body>
  <header>
    <h1>Robot Chat</h1>
    <span class="meta" id="meta">Debugging only. Esc sends STOP.</span>
    <a id="backup-stop" href="#" target="_blank" rel="noopener">Backup STOP page</a>
    <button class="link" id="new-chat" type="button">New chat</button>
  </header>

  <main id="log" aria-live="polite"></main>

  <footer>
    <textarea id="input" rows="1" placeholder="e.g. Drive forward 10 inches, then tell me where you are"></textarea>
    <button id="send" type="button">Send</button>
    <button id="stop" type="button">STOP</button>
  </footer>

<script>
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  // One conversation per tab. sessionStorage survives a reload of this tab
  // but not a new tab; guarded because storage can be blocked.
  function makeId() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
  let sessionId;
  try { sessionId = sessionStorage.getItem("sessionId") || makeId(); sessionStorage.setItem("sessionId", sessionId); }
  catch { sessionId = makeId(); }

  function add(cls, text) {
    const el = document.createElement("div");
    el.className = cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  // Each tool call becomes a collapsible line: name(args) -> ok/error,
  // with the full JSON result inside.
  function addTools(calls) {
    if (!calls.length) return;
    const box = document.createElement("div");
    box.className = "tools";
    for (const c of calls) {
      const d = document.createElement("details");
      const s = document.createElement("summary");
      s.textContent = `${c.name}(${JSON.stringify(c.args)}) → `;
      const status = document.createElement("span");
      status.textContent = c.result.ok ? "ok" : "error";
      if (!c.result.ok) status.className = "bad";
      s.appendChild(status);
      const pre = document.createElement("pre");
      pre.textContent = JSON.stringify(c.result, null, 2);
      d.append(s, pre);
      box.appendChild(d);
    }
    log.appendChild(box);
  }

  async function post(path, body) {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
                                  body: JSON.stringify(body || {}) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
    return data;
  }

  async function send() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = "";
    add("msg user", text);
    sendBtn.disabled = true;
    const thinking = add("thinking", "thinking…");
    try {
      const data = await post("/api/chat", { session_id: sessionId, message: text });
      thinking.remove();
      addTools(data.tool_calls);
      add("msg bot", data.reply || "(no reply)");
    } catch (e) {
      thinking.remove();
      add("err", "Error: " + e.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
      log.scrollTop = log.scrollHeight;
    }
  }

  async function stop() {
    try {
      await post("/api/stop");
      add("note", "STOP sent at " + new Date().toLocaleTimeString());
    } catch (e) {
      add("err", "STOP FAILED: " + e.message + ". Use the backup STOP page or the physical stop.");
    }
  }

  async function newChat() {
    try { await post("/api/reset", { session_id: sessionId }); } catch {}
    log.innerHTML = "";
    add("note", "New conversation.");
  }

  sendBtn.addEventListener("click", send);
  document.getElementById("stop").addEventListener("click", stop);
  document.getElementById("new-chat").addEventListener("click", newChat);
  input.addEventListener("keydown", (e) => {
    // Enter sends, Shift+Enter makes a new line.
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") stop(); });

  fetch("/api/config").then(r => r.json()).then(c => {
    document.getElementById("meta").textContent = `Model: ${c.model} · Debugging only. Esc sends STOP.`;
    document.getElementById("backup-stop").href = c.stop_page;
  }).catch(() => {});

  input.focus();
</script>
</body>
</html>
