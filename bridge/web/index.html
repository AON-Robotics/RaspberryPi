<!doctype html>
<!--
  Robot chat page. Talks only to the web app (app.py) that served it:
    GET  /api/health  status lights: every hop from the laptop to the robot
    POST /api/chat    send a message, get the reply + the tools that ran
    POST /api/stop    STOP button, goes straight to the robot (no LLM)
    POST /api/reset   "New chat"
    POST /api/logout  "Log out"
  Tool results are shown as raw JSON on purpose, so when the real robot
  tools return different fields, this page needs no changes.
  Script and styles live in static/ because the app's Content-Security-
  Policy blocks inline code.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Chat</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <h1>Robot Chat</h1>
    <span class="meta" id="meta">Debugging only. Esc sends STOP.</span>
    <a id="backup-stop" href="#" target="_blank" rel="noopener noreferrer">Backup STOP page</a>
    <button class="link" id="new-chat" type="button">New chat</button>
    <button class="link" id="logout" type="button">Log out</button>
  </header>
  <div id="health" aria-live="polite">Checking the pipeline…</div>

  <main id="log" aria-live="polite"></main>

  <footer>
    <textarea id="input" rows="1" maxlength="2000" placeholder="e.g. Drive forward 10 inches, then tell me where you are"></textarea>
    <button id="send" type="button">Send</button>
    <button id="stop" type="button">STOP</button>
  </footer>

<script src="/static/app.js"></script>
</body>
</html>
